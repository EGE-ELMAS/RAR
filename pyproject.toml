[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "clinical-re-bilingual"
version = "0.1.0"
description = "Bilingual English-Turkish clinical relation extraction with retrieval-augmented prompting"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Aidana Aidynkyzy" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.4,<2",
  "torch>=2.2,<3",
  "transformers>=4.44,<5",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
openai = ["openai>=1.50,<3"]
gemini = ["google-genai>=1.0,<2"]
notebooks = ["jupyterlab>=4.2,<5", "matplotlib>=3.8,<4", "seaborn>=0.13,<1"]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[project.scripts]
clinical-re = "clinical_re_bilingual.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_re_bilingual"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
